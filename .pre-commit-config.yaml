repos:
  - repo: local
    hooks:
      - id: prettier
        name: Format with Prettier
        language: system
        entry: npx prettier --write
        files: \.(ts|js|svelte|json|md|yml|yaml)$
        exclude: ^(node_modules|\.svelte-kit|build|package-lock\.json)
      - id: eslint
        name: Lint TypeScript/Svelte with ESLint
        language: system
        entry: npx eslint --max-warnings 0
        files: \.(ts|svelte|js)$
        exclude: ^(node_modules|\.svelte-kit|build)
      - id: svelte-check
        name: Typecheck (svelte-check)
        language: system
        entry: npm run check
        files: \.(ts|svelte)$
        exclude: ^(node_modules|\.svelte-kit|build)
        pass_filenames: false
        stages: [pre-push]
      - id: e2e
        name: Build and run end-to-end tests
        language: system
        entry: sh scripts/pre-push-check.sh
        pass_filenames: false
        stages: [pre-push]
